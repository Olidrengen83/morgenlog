name: ForældreIntra → kalender

on:
  schedule:
    - cron: "17 5,13 * * *"   # ca. 06/07 og 14/15 dansk tid
  workflow_dispatch:
    inputs:
      force:
        description: "Send alle sider til Claude og gensynkronisér alt"
        type: boolean
        default: false

concurrency: foraeldreintra

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foraeldreintra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foraeldreintra/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Hent tidligere tilstand
        uses: actions/cache/restore@v4
        with:
          path: foraeldreintra/state
          key: fi-state-${{ github.run_id }}
          restore-keys: fi-state-

      - name: Skriv config fra secret
        env:
          CFG: ${{ secrets.FORAELDREINTRA_CONFIG }}
        run: printf '%s' "$CFG" > config.yaml

      - name: Kør fetcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FI_BARN1_USER: ${{ secrets.FI_BARN1_USER }}
          FI_BARN1_PASS: ${{ secrets.FI_BARN1_PASS }}
          FI_BARN2_USER: ${{ secrets.FI_BARN2_USER }}
          FI_BARN2_PASS: ${{ secrets.FI_BARN2_PASS }}
          FI_BARN3_USER: ${{ secrets.FI_BARN3_USER }}
          FI_BARN3_PASS: ${{ secrets.FI_BARN3_PASS }}
        run: python fetcher.py --config config.yaml ${{ inputs.force && '--force' || '' }}

      - name: Gem tilstand
        if: always()
        uses: actions/cache/save@v4
        with:
          path: foraeldreintra/state
          key: fi-state-${{ github.run_id }}
