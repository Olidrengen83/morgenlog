# Kopiér til config.yaml og ret til. Adgangskoden skrives ALDRIG her –
# den ligger i miljøvariablerne FI_USER og FI_PASS.

timezone: Europe/Copenhagen
model: claude-opus-5-5
max_pages: 25          # max antal sider pr. barn pr. kørsel
keep_past_days: 30     # hvor længe gamle begivenheder bliver liggende

# Ét ForældreIntra-login, der giver adgang til alle tre børn.
account:
  url: https://skolenavn.m.skoleintra.dk/   # adressen du logger ind på
  login: direct                              # ForældreIntra-brugernavn/adgangskode
  username_env: FI_USER
  password_env: FI_PASS

# Én linje pr. indgang. `match` er barnets navn, som det står i ForældreIntra's
# barnevælger – kun nødvendig hvis det afviger fra `name`.
children:
  - name: Barn1
    color_id: "9"          # Google-farve 1–11 (valgfri)
  - name: Barn2
    match: Barn2 Mellemnavn
    color_id: "10"
  - name: Barn3
    color_id: "6"
    # calendar_id: xxx@group.calendar.google.com   # egen kalender kun til dette barn
    # extra_urls: [https://skolenavn.m.skoleintra.dk/parent/123/Barn3/Calendar]

google_calendar:
  enabled: false
  # Din private Google-kalender (se README). "primary" virker ikke med en
  # servicekonto – brug kalenderens ID, fx din gmail-adresse eller en ny "Skole"-kalender.
  calendar_id: xxx@group.calendar.google.com
